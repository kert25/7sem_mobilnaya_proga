# Gradle запускается на JDK 17 (см. README): Android Studio берёт его из
# .gradle/config.properties, командная строка — из setup-android.ps1.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true

# Параллельная сборка и параллельная синхронизация Android Studio.
# Вторую строку мастер IDE дописывает сам в диалоге "Enable parallel sync
# for this project"; она стоит здесь заранее, чтобы диалог не появлялся.
org.gradle.parallel=true
org.gradle.tooling.parallel=true

# Путь к папке проекта содержит кириллицу. Без этой строки AGP отказывается
# собирать проект на Windows.
android.overridePathCheck=true

android.useAndroidX=true
kotlin.code.style=official
